<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuYi App - Apoyá el Proyecto</title>
    <style>
        :root {
            --bg-color: #fffaef;
            --card-bg: #ffffff;
            --text-main: #451a03;
            --text-accent: #78350f;
            --mp-blue: linear-gradient(90deg, #009EE3, #00B1EA);
            --pp-blue: linear-gradient(90deg, #0070BA, #1546A0);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h1 { color: var(--text-accent); margin-bottom: 10px; font-size: 24px; }
        p { line-height: 1.6; font-size: 15px; color: #6b7280; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-mp { background: var(--mp-blue); }
        .btn-pp { background: var(--pp-blue); }
        .icon { font-size: 20px; margin-right: 10px; }
        footer { margin-top: 20px; font-size: 12px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐹</div>
        <h1>Apoyá a KuYi App</h1>
        <p>Si la app te ayudó con tus cobis, podés colaborar para que siga creciendo y manteniéndose libre de anuncios.</p>
        
        <a href="https://link.mercadopago.com.ar/kuyi" target="_blank" class="btn btn-mp">
            <span class="icon">💳</span> Mercado Pago
        </a>
        
        <a href="https://paypal.me/osoriofederico" target="_blank" class="btn btn-pp">
            <span class="icon">🌐</span> PayPal
        </a>

        <footer>
            Hecho con 💛 para la comunidad de cobayas
        </footer>
    </div>
</body>
</html>
