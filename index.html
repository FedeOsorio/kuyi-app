<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KuYi App - Apoyá el Proyecto</title>
    <style>
        :root {
            --bg-color: #fffaef;
            --card-bg: #ffffff;
            --text-main: #451a03;
            --text-accent: #78350f;
            --mp-blue: linear-gradient(90deg, #009EE3, #00B1EA);
            --pp-blue: linear-gradient(90deg, #0070BA, #1546A0);
            --kf-color: linear-gradient(90deg, #FFB000, #FFCC33);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Altura dinámica para mobile */
            overflow: hidden; /* Evita el scroll global */
        }

        .container {
            width: 90%;
            max-width: 380px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(120, 53, 15, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo { 
            font-size: 48px; 
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        h1 { 
            color: var(--text-accent); 
            margin: 0 0 12px 0; 
            font-size: 22px;
            font-weight: 700;
        }

        p { 
            line-height: 1.5; 
            font-size: 14px; 
            color: #5d4037; 
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.1s active;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-mp { background: var(--mp-blue); }
        .btn-pp { background: var(--pp-blue); }
        .btn-kf { background: var(--kf-color); }

        .icon { 
            font-size: 20px; 
            margin-right: 12px; 
        }

        footer { 
            margin-top: 24px; 
            font-size: 11px; 
            color: var(--text-accent);
            opacity: 0.6;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐹</div>
        <h1>KuYi App</h1>
        <p>Si la app te ayudó con tus cobis, podés colaborar para que siga creciendo sin anuncios.</p>
        
        <div class="btn-group">
            <a href="https://link.mercadopago.com.ar/kuyi" target="_blank" class="btn btn-mp">
                <span class="icon">💳</span> Mercado Pago
            </a>

              <a href="https://ko-fi.com/kuyiapp" target="_blank" class="btn btn-kf">
                <span class="icon">☕</span> Coffee
            </a>
            
            <a href="https://paypal.me/osoriofederico" target="_blank" class="btn btn-pp">
                <span class="icon">🌐</span> PayPal
            </a>
        </div>

        <footer>
            Hecho con 💛 para la comunidad de cobayas
        </footer>
    </div>
</body>
</html>
